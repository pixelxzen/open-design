<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Space Cosmos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
    <div id="deck-container">
        <section class="slide active" id="slide-1">
            <h1 class="editable-text" data-id="space-s1-h1" contenteditable="true">COSMOS</h1>
            <p class="editable-text" data-id="space-s1-p1" contenteditable="true">Journey into the infinite depths of design.</p>
        </section>
        <section class="slide" id="slide-2">
            <h1 class="editable-text" data-id="space-s2-h1" contenteditable="true">NEBULA</h1>
            <p class="editable-text" data-id="space-s2-p1" contenteditable="true">Where creativity and entropy collide.</p>
        </section>
    </div>

    <div id="controls">
        <button id="export-btn">💾 Export</button>
    </div>

    <script>
        const isRenderMode = window.location.search.includes('render=true');
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        // 1. 构建用于录制的确定性全局 Timeline
        const tl = gsap.timeline({ paused: true });

        // Slide 1 动画 (t = 0 到 t = 5)
        tl.addLabel("slide1", 0);
        tl.from(slides[0].querySelector('h1'), {
            duration: 2.5,
            opacity: 0,
            scale: 1.2,
            filter: "blur(10px)",
            ease: "power2.out"
        }, 0);
        tl.from(slides[0].querySelector('p'), {
            duration: 2,
            opacity: 0,
            y: 30,
            ease: "power1.out"
        }, 0.8);

        // Slide 2 动画 (t = 5 到 t = 10)
        tl.addLabel("slide2", 5);
        tl.from(slides[1].querySelector('h1'), {
            duration: 2.5,
            opacity: 0,
            scale: 1.2,
            filter: "blur(10px)",
            ease: "power2.out"
        }, 5);
        tl.from(slides[1].querySelector('p'), {
            duration: 2,
            opacity: 0,
            y: 30,
            ease: "power1.out"
        }, 5.8);

        // 注册到全局对象供录制器 Seek
        window.__timelines = {
            main: tl
        };

        window.renderFrame = function(t) {
            // 根据时间切换 slide 的激活状态
            if (t >= 5) {
                if (currentSlide !== 1) {
                    slides[0].classList.remove('active');
                    slides[1].classList.add('active');
                    currentSlide = 1;
                }
            } else {
                if (currentSlide !== 0) {
                    slides[1].classList.remove('active');
                    slides[0].classList.add('active');
                    currentSlide = 0;
                }
            }
            tl.seek(t);
        };

        // 2. 区分运行模式
        if (!isRenderMode) {
            // 交互模式：允许键盘翻页
            window.addEventListener('keydown', (e) => {
                if (document.activeElement.contentEditable === 'true') return;
                if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
                if (e.key === 'ArrowLeft') prevSlide();
            });

            function showSlide(index) {
                slides[currentSlide].classList.remove('active');
                currentSlide = (index + slides.length) % slides.length;
                const activeSlide = slides[currentSlide];
                activeSlide.classList.add('active');
                runAnimation(activeSlide);
            }

            function nextSlide() { showSlide(currentSlide + 1); }
            function prevSlide() { showSlide(currentSlide - 1); }

            function runAnimation(activeSlide) {
                gsap.set(activeSlide.querySelectorAll('*'), { clearProps: "all" });
                
                gsap.from(activeSlide.querySelector('h1'), {
                    duration: 2.5,
                    opacity: 0,
                    scale: 1.2,
                    filter: "blur(10px)",
                    ease: "power2.out"
                });

                gsap.from(activeSlide.querySelector('p'), {
                    duration: 2,
                    opacity: 0,
                    y: 30,
                    delay: 0.8,
                    ease: "power1.out"
                });
            }

            // 初始化播放第一页
            runAnimation(slides[0]);
        } else {
            // 录制模式下由录制器通过 window.renderFrame(t) 驱动
            window.renderFrame(0);
        }

        // Editable text 逻辑
        document.querySelectorAll('.editable-text').forEach(el => {
            const id = el.getAttribute('data-id');
            const saved = localStorage.getItem(id);
            if (saved) el.innerText = saved;
            el.addEventListener('input', () => {
                localStorage.setItem(id, el.innerText);
            });
        });

        // 导出逻辑
        document.getElementById('export-btn').onclick = () => {
            const content = document.documentElement.outerHTML;
            const blob = new Blob([content], {type: 'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'space-deck.html';
            a.click();
        };
</body>
</html>
